pekko {
  actor {
    provider = cluster
    allow-java-serialization = off
    serialization-bindings { "exercise1.protocols.CborSerializable" = jackson-cbor }
  }
  cluster {
    seed-nodes = ["pekko://alarm@node1:2551", "pekko://alarm@node2:2552"]
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    sharding.passivate-idle-entity-after = off   # fondamentale, vedi sotto
  }
}