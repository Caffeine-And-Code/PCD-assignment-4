pekko {
  actor {
    provider = cluster
    allow-java-serialization = off

    serialization-bindings {
        "pcd.exercise1.protocols.Serializable" = jackson-cbor
    }
  }

  remote.artery.canonical {
    hostname = ${?CLUSTER_HOST}
    port = ${?CLUSTER_PORT}
  }

  cluster {
    seed-nodes = [
      "pekko://alarm@node1:2551"
    ]

    downing-provider-class =
      "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
  }
}